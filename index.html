<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Question 💌</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 91, 135, .25), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, .22), transparent 30%),
        linear-gradient(135deg, #0b0710, #180c19 50%, #0b0710);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      overflow-x: hidden;
    }

    .card {
      width: min(520px, 100%);
      padding: 42px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 30px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(25px);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      position: relative;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #ff4f81;
      filter: blur(90px);
      opacity: .25;
      top: -80px;
      right: -60px;
    }

    .emoji {
      font-size: 58px;
      margin-bottom: 18px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: clamp(32px, 8vw, 48px);
      letter-spacing: -1.5px;
      margin-bottom: 12px;
    }

    .gradient {
      background: linear-gradient(90deg, #ff6b9a, #ffb1c8);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #cfc5d0;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .question {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 28px;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      padding: 15px 30px;
      border-radius: 999px;
      transition: .2s ease;
    }

    .yes {
      color: white;
      background: linear-gradient(135deg, #ff477e, #ff6a9a);
      box-shadow: 0 10px 30px rgba(255,71,126,.3);
    }

    .yes:hover {
      transform: translateY(-3px) scale(1.03);
    }

    .no {
      color: #ddd;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
    }

    .no:hover {
      transform: translateY(-2px);
    }

    .message-box {
      display: none;
      margin-top: 20px;
      animation: appear .4s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.2);
      color: white;
      border-radius: 18px;
      padding: 15px;
      outline: none;
      font: inherit;
      margin-bottom: 12px;
    }

    textarea:focus {
      border-color: #ff6b9a;
    }

    .send {
      width: 100%;
      background: white;
      color: #171018;
    }

    .response {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.08);
      line-height: 1.5;
    }

    .success {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .small {
      color: #a99eaa;
      font-size: 13px;
      margin-top: 22px;
    }

    .heart {
      position: fixed;
      pointer-events: none;
      animation: heartFly 2.5s linear forwards;
      font-size: 20px;
      z-index: 10;
    }

    @keyframes heartFly {
      0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
      }
      20% { opacity: 1; }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media(max-width: 480px) {
      .card {
        padding: 35px 22px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="glow"></div>

    <div class="emoji">💌</div>

    <h1>
      Okay... I have a
      <span class="gradient">question.</span>
    </h1>

    <p class="subtitle">
      We've matched, we've talked...
      so I think it's time I ask you something slightly more important.
    </p>

    <div class="question">
      Would you go on a date with me? 👀
    </div>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">
        Yes, let's go ❤️
      </button>

      <button class="no" onclick="sayNo()">
        Hmm... maybe 😌
      </button>
    </div>

    <div class="message-box" id="messageBox">

      <textarea
        id="message"
        placeholder="Tell me what you're thinking... 💭"
      ></textarea>

      <button class="send" onclick="sendMessage()">
        Send it 💌
      </button>

    </div>

    <div class="response" id="response"></div>

    <div class="small">
      No pressure. Just two people potentially having a dangerously good time. ✨
    </div>

  </main>

  <script>

    function createHearts() {
      for (let i = 0; i < 18; i++) {
        const heart = document.createElement("div");

        heart.className = "heart";
        heart.innerHTML = ["❤️", "💗", "💕", "💖"][Math.floor(Math.random() * 4)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "-30px";
        heart.style.animationDelay = Math.random() * .8 + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 3500);
      }
    }

    function sayYes() {

      createHearts();

      document.getElementById("messageBox").style.display = "block";

      document.getElementById("response").style.display = "block";

      document.getElementById("response").innerHTML = `
        <div class="success">🥹❤️</div>
        <strong>Okay, that's a yes!</strong><br>
        Now tell me what kind of date you're imagining...
      `;
    }

    function sayNo() {

      const response = document.getElementById("response");

      response.style.display = "block";

      response.innerHTML = `
        <div class="success">😌</div>
        <strong>I'll take "maybe"...</strong><br>
        What would convince you?
      `;

      document.getElementById("messageBox").style.display = "block";
    }

    function sendMessage() {

      const message =
        document.getElementById("message").value.trim();

      if (!message) {
        alert("Write something first 😭");
        return;
      }

      document.getElementById("response").style.display = "block";

      document.getElementById("response").innerHTML = `
        <div class="success">💌</div>
        <strong>Message received.</strong><br>
        "${escapeHTML(message)}"
        <br><br>
        <span style="color:#aaa">
          Now we just need to pick a day 😉
        </span>
      `;

      createHearts();
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

  </script>

</body>
</html>
