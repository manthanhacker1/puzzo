<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Check</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: #161b22;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      text-align: center;
      max-width: 420px;
      width: 100%;
      border: 1px solid #30363d;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      background: #238636;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    h2 { color: #f0f6fc; margin-top: 0; font-size: 1.4rem; }
    p { color: #8b949e; font-size: 0.95rem; line-height: 1.5; }

    button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #30363d;
      border-radius: 8px;
      background-color: #21262d;
      color: #58a6ff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }

    #feedback { margin-top: 15px; font-weight: 500; min-height: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <div id="badge" class="badge">SECURITY CHECK</div>
    <h2 id="title">Level 1: Quick Vibe Check</h2>
    <p id="description">Before proceeding, we need to verify if your decision-making skills are top tier.</p>
    
    <div id="interactive-area">
      <button onclick="nextLevel(1)">Option A: Good Taste & Great Conversations</button>
      <button onclick="nextLevel(0)">Option B: Boring Texts & Dry Responses</button>
    </div>

    <p id="feedback"></p>
  </div>

  <script>
    let currentLevel = 1;

    function nextLevel(choice) {
      const title = document.getElementById("title");
      const description = document.getElementById("description");
      const area = document.getElementById("interactive-area");
      const feedback = document.getElementById("feedback");

      if (currentLevel === 1) {
        if (choice === 1) {
          currentLevel = 2;
          title.innerText = "Level 2: Priorities Check";
          description.innerText = "What is the official protocol for a lazy weekend?";
          area.innerHTML = `
            <button onclick="nextLevel(1)">Option A: Good food, coffee, & zero alarms</button>
            <button onclick="nextLevel(0)">Option B: Waking up at 6 AM to do chores</button>
          `;
          feedback.style.color = "#3fb950";
          feedback.innerText = "Correct. Passed Level 1!";
        } else {
          feedback.style.color = "#f85149";
          feedback.innerText = "Incorrect choice. Try again!";
        }
      } 
      else if (currentLevel === 2) {
        if (choice === 1) {
          currentLevel = 3;
          document.getElementById("badge").innerText = "ACCESS GRANTED";
          document.getElementById("badge").style.background = "#8957e5";
          
          title.innerText = "Verification Complete 🏆";
          description.innerText = "Congratulations! You passed all security levels.";
          area.innerHTML = `
            <div style="background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #30363d; text-align: left;">
              <strong style="color: #f0f6fc;">Unlocked Voucher:</strong><br>
              <span style="color: #8b949e; font-size: 0.9rem;">1x Coffee / Dessert Date on me.</span><br><br>
              <em style="color: #58a6ff; font-size: 0.85rem;">*Claimable whenever you decide to stop playing hard to get.*</em>
            </div>
          `;
          feedback.style.color = "#3fb950";
          feedback.innerText = "100% Vibe Match.";
        } else {
          feedback.style.color = "#f85149";
          feedback.innerText = "Wrong protocol. Who wakes up early on weekends?";
        }
      }
    }
  </script>
</body>
</html>
